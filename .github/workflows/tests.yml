name: Python tests

on:
  push:
    branches:
      - main
      - b58-objectify-cat-group-role-profiles
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile changed modules
        run: |
          python -m py_compile cats/cat_group_role_system.py
          python -m py_compile tests/test_cat_group_role_object_state.py
      - name: Run complete regression
        run: python -m pytest -q
