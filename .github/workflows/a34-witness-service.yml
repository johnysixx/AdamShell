name: A34 durable witnessed authority integration

on:
  pull_request:
    paths:
      - 'universe/symbolic_replay_witness_wire.py'
      - 'universe/symbolic_replay_witness_sqlite_authority.py'
      - 'universe/symbolic_replay_witness_https.py'
      - 'universe/symbolic_replay_witness_server_cli.py'
      - 'tests/test_symbolic_replay_witness_remote_authority.py'
      - 'docs/SYMBOLIC_REPLAY_WITNESS_SERVICE.md'
      - '.github/workflows/a34-witness-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-authority-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements-witness-auth.txt
      - name: Compile A34 modules
        run: |
          python -m py_compile \
            universe/symbolic_replay_witness_wire.py \
            universe/symbolic_replay_witness_sqlite_authority.py \
            universe/symbolic_replay_witness_https.py \
            universe/symbolic_replay_witness_server_cli.py
      - name: Real HTTPS SQLite witness integration
        run: python -m pytest -q tests/test_symbolic_replay_witness_remote_authority.py
      - name: Full regression
        run: python -m pytest -q
