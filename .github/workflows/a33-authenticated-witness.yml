name: A33 authenticated witness regression

on:
  pull_request:
    paths:
      - 'universe/symbolic_replay_authenticated_witness.py'
      - 'tests/test_symbolic_replay_authenticated_witness.py'
      - 'requirements-witness-auth.txt'
      - '.github/workflows/a33-authenticated-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a33-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements-witness-auth.txt
      - name: A33 authenticated witness tests
        run: python -m pytest -q tests/test_symbolic_replay_authenticated_witness.py
      - name: Full regression suite
        run: python -m pytest -q
